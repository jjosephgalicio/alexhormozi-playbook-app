[build]
  publish = "."

# Filenames aren't content-hashed, so never let the browser hold a stale copy: ask it
# to revalidate every file. Netlify serves ETags, so unchanged files come back as a
# cheap 304, and new deploys are always fetched. The service worker provides offline
# speed; the HTTP layer just needs to stay fresh.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
